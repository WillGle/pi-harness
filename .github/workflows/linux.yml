name: Linux support

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-24-04:
    name: Ubuntu 24.04 x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install ripgrep when the runner image does not provide it
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:runtime
      - run: npm run doctor
      - run: npm run verify:skills
